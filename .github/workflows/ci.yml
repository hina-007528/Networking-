name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://stormfiber:stormfiber@localhost:5432/stormfiber?schema=public

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_ADMIN_URL: http://localhost:3001

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright browsers
        run: pnpm --filter @stormfiber/web exec playwright install --with-deps chromium

      - name: End-to-end
        run: pnpm test:e2e
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: http://localhost:3000

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build API, worker, web and admin images
        run: docker compose build
        env:
          NEXT_PUBLIC_API_URL: http://localhost/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost
          NEXT_PUBLIC_ADMIN_URL: http://localhost/admin
