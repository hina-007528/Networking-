# Production-style stack.
#
# Local day-to-day development should keep using docker-compose.dev.yml (Postgres, Redis, Mailpit)
# plus `pnpm dev` on the host. This file is the containerised website + API + worker + reverse proxy.

name: stormfiber

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stormfiber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stormfiber}
      POSTGRES_DB: ${POSTGRES_DB:-stormfiber}
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-stormfiber} -d ${POSTGRES_DB:-stormfiber}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1000
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-stormfiber}:${POSTGRES_PASSWORD:-stormfiber}@postgres:5432/${POSTGRES_DB:-stormfiber}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_URL: ${API_URL:-http://localhost/api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s
    command:
      - sh
      - -c
      - npx prisma migrate deploy && node dist/apps/api/src/main.js

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-stormfiber}:${POSTGRES_PASSWORD:-stormfiber}@postgres:5432/${POSTGRES_DB:-stormfiber}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost/admin}
        NEXT_PUBLIC_ADMIN_BASE_PATH: /admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - admin
      - api

volumes:
  postgres-data:
    name: stormfiber-prod-postgres
  redis-data:
    name: stormfiber-prod-redis
